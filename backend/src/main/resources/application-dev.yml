# ============================================================================
# Perfil de desarrollo (dev). Activar con: --spring.profiles.active=dev
#
# Sigue sin embeber secretos (Req 11): las credenciales se toman de variables
# de entorno. Este perfil solo ajusta verbosidad y comportamiento de desarrollo.
# ============================================================================

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

# En dev se pueden mostrar mas detalles de health para diagnostico local.
management:
  endpoint:
    health:
      show-details: always
