<app-page-header titulo="Canales de venta" subtitulo="Administra los canales por los que tu empresa vende: define, activa o desactiva cada canal de venta.">
  <div acciones>
    @if (puedeCrear) {
      <button matButton="filled" type="button" (click)="nuevo()">
        <mat-icon aria-hidden="true">add</mat-icon>
        Nuevo canal
      </button>
    }
  </div>
</app-page-header>

<!-- Tira de indicadores (patron enterprise: outcome-first). Solo cuando el
     listado cargo correctamente para no distraer en vacio. -->
@if (fase() === "ok") {
  <section class="comercial-kpis" aria-label="Indicadores de canales de venta">
    <button
      type="button"
      class="kpi-boton"
      (click)="abrirInfoKpi('canales_venta_total', 'Canales de venta', total(), 'conteo')"
      aria-label="Ver explicación de Canales de venta"
    >
      <app-kpi-tile icono="hub" tono="primario" etiqueta="Canales de venta"
        sublabel="Total en el catálogo" [valor]="total()" />
    </button>
    <button
      type="button"
      class="kpi-boton"
      (click)="abrirInfoKpi('canales_venta_activos', 'Activos', canalesActivos(), 'conteo')"
      aria-label="Ver explicación de Canales activos"
    >
      <app-kpi-tile icono="check_circle" tono="exito" etiqueta="Activos"
        sublabel="En esta página" [valor]="canalesActivos()" />
    </button>
  </section>
}

<mat-form-field appearance="outline" class="comercial-filtro">
  <mat-label>Buscar por nombre</mat-label>
  <input matInput type="search" [value]="filtro()" (change)="aplicarFiltro($any($event.target).value)" />
  <mat-icon matSuffix aria-hidden="true">search</mat-icon>
</mat-form-field>

<app-state-container
  [fase]="fase()"
  [mensajeError]="mensajeError()"
  mensajeVacio="No hay canales de venta que coincidan."
  (reintentar)="cargar()"
>
  <app-data-table
    [columnas]="columnas"
    [filas]="canales()"
    [total]="total()"
    [page]="page()"
    [size]="size()"
    (cambioPagina)="onPagina($event)"
  >
    <ng-template appCelda="nombre" let-fila>{{ fila.nombre }}</ng-template>
    <ng-template appCelda="descripcion" let-fila>{{ fila.descripcion || '—' }}</ng-template>
    <ng-template appCelda="acciones" let-fila>
      <div class="comercial-acciones-fila">
        @if (puedeActualizar) {
          <button matIconButton type="button" (click)="editar(fila)" matTooltip="Editar" aria-label="Editar canal">
            <mat-icon aria-hidden="true">edit</mat-icon>
          </button>
        }
        @if (puedeEliminar) {
          <button
            matIconButton
            type="button"
            class="ds-boton-destructivo"
            (click)="eliminar(fila)"
            matTooltip="Dar de baja"
            aria-label="Dar de baja canal"
          >
            <mat-icon aria-hidden="true">delete</mat-icon>
          </button>
        }
      </div>
    </ng-template>
  </app-data-table>
</app-state-container>
