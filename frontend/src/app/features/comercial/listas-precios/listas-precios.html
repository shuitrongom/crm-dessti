<app-page-header titulo="Listas de precios" subtitulo="Define listas de precios por producto con su vigencia y prioridad para aplicar el precio correcto en cada venta.">
  <div acciones>
    @if (puedeCrear) {
      <button matButton="filled" type="button" (click)="nuevo()">
        <mat-icon aria-hidden="true">add</mat-icon>
        Nueva lista
      </button>
    }
  </div>
</app-page-header>

<!-- Tira de indicadores (patron enterprise: outcome-first). Solo cuando el
     listado cargo correctamente para no distraer en vacio. -->
@if (fase() === "ok") {
  <section class="comercial-kpis" aria-label="Indicadores de listas de precios">
    <button
      type="button"
      class="kpi-boton"
      (click)="abrirInfoKpi('listas_precios_total', 'Listas de precios', total(), 'conteo')"
      aria-label="Ver explicación de Listas de precios"
    >
      <app-kpi-tile icono="sell" tono="primario" etiqueta="Listas de precios"
        sublabel="Total en el catálogo" [valor]="total()" />
    </button>
    <button
      type="button"
      class="kpi-boton"
      (click)="abrirInfoKpi('listas_precios_vigentes', 'Vigentes hoy', listasVigentes(), 'conteo')"
      aria-label="Ver explicación de Vigentes hoy"
    >
      <app-kpi-tile icono="event_available" tono="exito" etiqueta="Vigentes hoy"
        sublabel="En esta página" [valor]="listasVigentes()" />
    </button>
  </section>
}

<mat-form-field appearance="outline" class="comercial-filtro">
  <mat-label>Buscar por nombre</mat-label>
  <input matInput type="search" [value]="filtro()" (change)="aplicarFiltro($any($event.target).value)" />
  <mat-icon matSuffix aria-hidden="true">search</mat-icon>
</mat-form-field>

<app-state-container
  [fase]="fase()"
  [mensajeError]="mensajeError()"
  mensajeVacio="No hay listas de precios que coincidan."
  (reintentar)="cargar()"
>
  <app-data-table
    [columnas]="columnas"
    [filas]="listas()"
    [total]="total()"
    [page]="page()"
    [size]="size()"
    (cambioPagina)="onPagina($event)"
  >
    <ng-template appCelda="nombre" let-fila>{{ fila.nombre }}</ng-template>
    <ng-template appCelda="prioridad" let-fila>{{ fila.prioridad }}</ng-template>
    <ng-template appCelda="segmento" let-fila>{{ fila.segmento || 'General' }}</ng-template>
    <ng-template appCelda="vigencia" let-fila>
      {{ fila.vigenciaInicio }} — {{ fila.vigenciaFin || 'Abierta' }}
    </ng-template>
    <ng-template appCelda="acciones" let-fila>
      <div class="comercial-acciones-fila">
        @if (puedeActualizar) {
          <button
            matIconButton
            type="button"
            (click)="abrirAsignarPrecio(fila)"
            matTooltip="Asignar precios"
            aria-label="Asignar precios a la lista"
          >
            <mat-icon aria-hidden="true">sell</mat-icon>
          </button>
          <button matIconButton type="button" (click)="editar(fila)" matTooltip="Editar" aria-label="Editar lista">
            <mat-icon aria-hidden="true">edit</mat-icon>
          </button>
          <button
            matIconButton
            type="button"
            class="ds-boton-destructivo"
            (click)="eliminar(fila)"
            matTooltip="Dar de baja"
            aria-label="Dar de baja lista"
          >
            <mat-icon aria-hidden="true">delete</mat-icon>
          </button>
        }
      </div>
    </ng-template>
  </app-data-table>
</app-state-container>
