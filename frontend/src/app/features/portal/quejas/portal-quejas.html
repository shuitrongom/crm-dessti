<app-page-header
  titulo="Soporte y quejas"
  subtitulo="Levanta una queja o solicitud y da seguimiento a las que ya registraste."
>
  <button acciones matButton="filled" type="button" (click)="alternarForm()">
    <mat-icon>{{ mostrarForm() ? 'close' : 'add' }}</mat-icon>
    {{ mostrarForm() ? 'Cerrar' : 'Nueva queja' }}
  </button>
</app-page-header>

@if (mostrarForm()) {
  <mat-card appearance="outlined">
    <mat-card-content>
      <form [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
        <mat-form-field appearance="outline" style="width: 100%">
          <mat-label>Describe tu queja o solicitud</mat-label>
          <textarea
            matInput
            formControlName="descripcion"
            rows="4"
            maxlength="2000"
            placeholder="Cuéntanos qué ocurrió para poder ayudarte."
          ></textarea>
          <mat-error>La descripción es obligatoria.</mat-error>
        </mat-form-field>
        <div>
          <button matButton="filled" type="submit" [disabled]="enviando()">Enviar queja</button>
          <button matButton type="button" (click)="alternarForm()">Cancelar</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
}

<app-state-container
  [fase]="estado().fase"
  [mensajeError]="estado().mensajeError"
  mensajeVacio="Aún no has registrado quejas."
  (reintentar)="cargar()"
>
  <app-data-table
    [columnas]="columnas"
    [filas]="estado().datos ?? []"
    [total]="total()"
    [page]="page()"
    [size]="size()"
    (cambioPagina)="cambiarPagina($event)"
  >
    <ng-template appCelda="descripcion" let-q>{{ q.descripcion }}</ng-template>
    <ng-template appCelda="estado" let-q>
      <app-estado-chip [etiqueta]="humanizar(q.estado)" [tono]="tono(q.estado)" />
    </ng-template>
    <ng-template appCelda="fecha" let-q>{{ q.registradaEn | date: 'dd/MM/yyyy' }}</ng-template>
  </app-data-table>
</app-state-container>
