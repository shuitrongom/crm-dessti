<app-page-header titulo="Proyectos" subtitulo="Administra tus proyectos y sus sitios, y consulta el avance consolidado de cada uno.">
  <div acciones>
    @if (puedeCrear) {
      <button matButton="filled" type="button" (click)="nuevo()">
        <mat-icon aria-hidden="true">add</mat-icon>
        Nuevo proyecto
      </button>
    }
  </div>
</app-page-header>

<mat-form-field appearance="outline" class="operacion-filtro">
  <mat-label>Filtrar por cliente</mat-label>
  <input matInput type="search" [value]="clienteId()" (change)="filtrarPorCliente($any($event.target).value)" />
  <mat-icon matSuffix aria-hidden="true">search</mat-icon>
</mat-form-field>

<app-state-container
  [fase]="fase()"
  [mensajeError]="mensajeError()"
  mensajeVacio="No hay proyectos para el filtro seleccionado."
  (reintentar)="cargar()"
>
  <app-data-table
    [columnas]="columnas"
    [filas]="proyectos()"
    [total]="total()"
    [page]="page()"
    [size]="size()"
    (cambioPagina)="onPagina($event)"
  >
    <ng-template appCelda="nombre" let-fila>
      <a [routerLink]="[fila.id]" class="operacion-enlace">{{ fila.nombre }}</a>
    </ng-template>
    <ng-template appCelda="clienteId" let-fila>{{ nombreCliente(fila.clienteId) }}</ng-template>
    <ng-template appCelda="acciones" let-fila>
      <div class="operacion-acciones-fila">
        <a matIconButton [routerLink]="[fila.id]" matTooltip="Ver detalle" aria-label="Ver detalle del proyecto">
          <mat-icon aria-hidden="true">visibility</mat-icon>
        </a>
        @if (puedeActualizar) {
          <button matIconButton type="button" (click)="editar(fila)" matTooltip="Editar" aria-label="Editar proyecto">
            <mat-icon aria-hidden="true">edit</mat-icon>
          </button>
        }
      </div>
    </ng-template>
  </app-data-table>
</app-state-container>
