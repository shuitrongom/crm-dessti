<app-page-header titulo="Levantamientos de sitio" subtitulo="Registra los levantamientos de sitio con sus mediciones y las condiciones físicas del lugar.">
  <div acciones>
    @if (puedeCrear) {
      <button matButton="filled" type="button" (click)="nuevo()">
        <mat-icon aria-hidden="true">add</mat-icon>
        Nuevo levantamiento
      </button>
    }
  </div>
</app-page-header>

@if (fase() === "ok") {
  <section class="operacion-kpis" aria-label="Indicadores de levantamientos">
    <button
      type="button"
      class="kpi-boton"
      (click)="abrirInfoKpi('levantamientos_en_proceso', 'En proceso', totalEnProceso() ?? 0, 'conteo')"
      aria-label="Ver explicación de levantamientos en proceso"
    >
      <app-kpi-tile icono="straighten" tono="advertencia" etiqueta="En proceso"
        sublabel="Mediciones por cerrar" [valor]="totalEnProceso()" />
    </button>
    <button
      type="button"
      class="kpi-boton"
      (click)="abrirInfoKpi('levantamientos_completados', 'Completados', totalCompletados() ?? 0, 'conteo')"
      aria-label="Ver explicación de levantamientos completados"
    >
      <app-kpi-tile icono="task_alt" tono="exito" etiqueta="Completados"
        sublabel="Levantamientos cerrados" [valor]="totalCompletados()" />
    </button>
  </section>
}

<mat-form-field appearance="outline" class="operacion-filtro">
  <mat-label>Filtrar por estado</mat-label>
  <mat-select [value]="estado()" (valueChange)="cambiarFiltro($event)">
    <mat-option value="">Todos</mat-option>
    @for (opcion of estados; track opcion) {
      <mat-option [value]="opcion">{{ etiquetaEstado(opcion) }}</mat-option>
    }
  </mat-select>
</mat-form-field>

<app-state-container
  [fase]="fase()"
  [mensajeError]="mensajeError()"
  mensajeVacio="No hay levantamientos para el filtro seleccionado."
  (reintentar)="cargar()"
>
  <app-data-table
    [columnas]="columnas"
    [filas]="levantamientos()"
    [total]="total()"
    [page]="page()"
    [size]="size()"
    (cambioPagina)="onPagina($event)"
  >
    <ng-template appCelda="tipoSuperficie" let-fila>{{ fila.tipoSuperficie }}</ng-template>
    <ng-template appCelda="estado" let-fila>
      <app-chip-estado
        [variante]="varianteEstado($any(fila).estado)"
        [etiqueta]="etiquetaEstado($any(fila).estado)"
      />
    </ng-template>
    <ng-template appCelda="completadoEn" let-fila>
      {{ fila.completadoEn ? (fila.completadoEn | date: 'short') : '—' }}
    </ng-template>
    <ng-template appCelda="acciones" let-fila>
      <div class="operacion-acciones-fila">
        @if (puedeCompletar && fila.estado === 'en_proceso') {
          <button matButton="tonal" type="button" (click)="completar(fila)">
            <mat-icon aria-hidden="true">check</mat-icon>
            Completar
          </button>
        }
        <button
          matButton
          type="button"
          (click)="abrirFotos(fila)"
          [attr.aria-label]="'Gestionar fotos del levantamiento ' + fila.tipoSuperficie"
        >
          <mat-icon aria-hidden="true">photo_library</mat-icon>
          Fotos
        </button>
      </div>
    </ng-template>
  </app-data-table>
</app-state-container>
