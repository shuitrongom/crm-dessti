<app-page-header
  titulo="Recepciones de mercancía"
  subtitulo="Registra la entrada de materiales contra la orden de compra; es la tercera vía del proceso de abastecimiento."
>
  @if (puedeCrear) {
    <button acciones matButton="filled" type="button" (click)="nueva()">
      <mat-icon>add</mat-icon>
      Registrar recepción
    </button>
  }
</app-page-header>

<app-state-container
  [fase]="estado().fase"
  [mensajeError]="estado().mensajeError"
  mensajeVacio="No hay recepciones registradas."
  (reintentar)="cargar()"
>
  <!-- KPIs de la página cargada (clicables: abren su descripción) -->
  <section class="operacion-kpis" aria-label="Indicadores de recepciones">
    <button
      type="button"
      class="kpi-boton"
      (click)="abrirInfoKpi('recepciones_pagina', 'Recepciones', totalMostrado())"
      aria-label="Ver explicación de Recepciones"
    >
      <app-kpi-tile
        icono="local_shipping"
        tono="primario"
        etiqueta="Recepciones"
        sublabel="En esta página"
        [valor]="totalMostrado()"
      />
    </button>
    <button
      type="button"
      class="kpi-boton"
      (click)="abrirInfoKpi('recepciones_renglones', 'Renglones recibidos', totalRenglones())"
      aria-label="Ver explicación de Renglones recibidos"
    >
      <app-kpi-tile
        icono="inventory_2"
        tono="info"
        etiqueta="Renglones"
        sublabel="Materiales recibidos"
        [valor]="totalRenglones()"
      />
    </button>
  </section>

  <div class="compras-filtros">
    <app-search-autocomplete
      class="compras-buscador"
      etiqueta="Filtrar por orden de compra"
      placeholder="Escribe el folio o el proveedor…"
      ayuda="Elige una orden de compra para ver solo sus recepciones."
      [buscador]="buscarOrden"
      [etiquetaDe]="etiquetaOrden"
      [detalleDe]="detalleOrden"
      [iconoDe]="iconoOrden"
      (terminoChange)="actualizarBusquedaOrden($event)"
      (seleccion)="seleccionarOrden($event)"
    />
  </div>

  <app-data-table
    [columnas]="columnas"
    [filas]="estado().datos ?? []"
    [total]="total()"
    [page]="page()"
    [size]="size()"
    (cambioPagina)="cambiarPagina($event)"
  >
    <ng-template appCelda="id" let-r><span class="compras-mono">{{ r.id.slice(0, 8) }}</span></ng-template>
    <ng-template appCelda="orden" let-r><span class="compras-mono">{{ r.ordenCompraId.slice(0, 8) }}</span></ng-template>
    <ng-template appCelda="renglones" let-r>{{ r.partidas.length }}</ng-template>
    <ng-template appCelda="fecha" let-r>{{ r.recibidaEn | date: 'dd/MM/yyyy HH:mm' }}</ng-template>
    <ng-template appCelda="acciones" let-r>
      <button matIconButton [matMenuTriggerFor]="menu" aria-label="Acciones de la recepción">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item type="button" (click)="verDetalle(r)">
          <mat-icon>visibility</mat-icon>
          <span>Ver detalle</span>
        </button>
      </mat-menu>
    </ng-template>
  </app-data-table>
</app-state-container>
